name: Verify game and app

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all unit and integration tests
        run: npm test
      - name: Validate stage snapshots
        run: npm run validate:stages

  build-app-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Nuxt app
        run: npm run build
      - name: Verify Worker bundle without deploying
        run: npx wrangler deploy --config wrangler.api.jsonc --dry-run
