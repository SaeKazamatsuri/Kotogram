name: Verify game and app

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all unit and integration tests
        run: npm test
      - name: Validate stage snapshots
        run: npm run validate:stages
      - name: Explore bounded stage candidates
        run: npm run explore:stages -- --max-candidates=32 --max-ms=5000

  build-app-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Nuxt app
        run: npm run build
      - name: Verify Worker bundle without deploying
        run: npx wrangler deploy --config wrangler.api.jsonc --dry-run
      - name: Test real local SQLite Durable Objects
        run: |
          npx wrangler dev --config wrangler.api.jsonc --port 8787 --ip 127.0.0.1 > /tmp/kotogram-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID 2>/dev/null || true' EXIT
          if ! node --experimental-strip-types scripts/smoke-ranking-api.mjs; then
            cat /tmp/kotogram-worker.log
            exit 1
          fi
